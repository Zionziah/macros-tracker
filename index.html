<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Macros Tracker</title>
<meta name="description" content="Log meals, look up macros online by text or photo, and track your daily targets for any diet.">
<meta name="theme-color" content="#EEF1EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1714" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Macros">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one narrow column built for a phone. A sticky tab bar switches between Add food (online look-up by text or photo, then quick picks), Today, Next meal, Week and Targets. */
:root{
  --bg:#EEF1EC; --surface:#FBFCFA; --ink:#13201A; --muted:#58695F; --line:#D3DBD1;
  --accent:#C4440E; --accent-ink:#FFFFFF; --accent-soft:#F7E3D8;
  --good:#2E7D4F; --warn:#9A6A0B; --bad:#B8362A;
  --c-p:#1F7A6B; --c-c:#B57A00; --c-f:#7650B8; --c-k:#C4440E;
  --track:#E1E7DF;
  --f-display:'Bricolage Grotesque','Arial Narrow',system-ui,sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1714; --surface:#16231E; --ink:#E8EFEA; --muted:#93A59B; --line:#263830;
  --accent:#FF8A4C; --accent-ink:#1B0F07; --accent-soft:#33211A;
  --good:#5FBF84; --warn:#E3B341; --bad:#F0786A;
  --c-p:#4FC2AE; --c-c:#E3A93B; --c-f:#A68CE6; --c-k:#FF8A4C; --track:#22332C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1714; --surface:#16231E; --ink:#E8EFEA; --muted:#93A59B; --line:#263830;
  --accent:#FF8A4C; --accent-ink:#1B0F07; --accent-soft:#33211A;
  --good:#5FBF84; --warn:#E3B341; --bad:#F0786A;
  --c-p:#4FC2AE; --c-c:#E3A93B; --c-f:#A68CE6; --c-k:#FF8A4C; --track:#22332C; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:720px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);padding-block:14px 0}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand h1{font-size:26px;font-weight:800}
.brand span{color:var(--muted);font-size:12px;font-family:var(--f-mono);text-transform:uppercase;letter-spacing:.08em}
nav.tabs{display:flex;gap:2px;margin-top:10px;border-bottom:1px solid var(--line);overflow-x:auto}
nav.tabs button{flex:1 0 auto;background:none;border:0;padding:10px 12px;color:var(--muted);font-weight:500;border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
main{display:flex;flex-direction:column;gap:18px;padding-top:18px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.stack{display:flex;flex-direction:column;gap:14px}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-family:var(--f-mono)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spread{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:13px}

.datebar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.datebar h2{font-size:20px;font-weight:700}
.iconbtn{background:var(--surface);border:1px solid var(--line);border-radius:8px;width:40px;height:40px;font-size:18px;line-height:1}
.iconbtn:disabled{opacity:.35;cursor:default}

.big{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.big b{font-family:var(--f-display);font-size:46px;font-weight:800;line-height:1;letter-spacing:-.02em}
.bars{display:flex;flex-direction:column;gap:14px;margin-top:16px}
.bar .head{display:flex;justify-content:space-between;gap:8px;font-size:13px;margin-bottom:5px}
.bar .head b{font-weight:600}
.track{height:10px;border-radius:5px;background:var(--track);overflow:hidden}
.fill{height:100%;border-radius:5px;background:var(--col,var(--accent));min-width:0}
.fill.over{background:var(--bad)}

.notes{display:flex;flex-direction:column;gap:8px}
.note{display:flex;gap:10px;font-size:14px;padding:10px 12px;border-radius:8px;background:var(--bg);border:1px solid var(--line)}
.note i{flex:none;width:8px;border-radius:4px;background:var(--muted)}
.note.good i{background:var(--good)} .note.warn i{background:var(--warn)} .note.bad i{background:var(--bad)}

.sample{background:var(--accent-soft);border:1px solid var(--accent);border-radius:10px;padding:12px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:10px 16px;font-weight:600;min-height:42px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:6px 12px;min-height:34px;font-size:13px}
.btn.danger{background:var(--bad);color:#fff}
.btn:disabled{opacity:.5;cursor:default}

.meal h3{font-size:16px;font-weight:700}
.entry{display:flex;gap:10px;justify-content:space-between;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.entry:first-of-type{border-top:0}
.entry .nm{font-weight:500}
.entry .mods{font-size:12.5px;color:var(--muted)}
.entry .mac{font-size:12.5px;color:var(--muted);margin-top:2px}
.entry button.x{background:none;border:0;color:var(--muted);font-size:20px;line-height:1;padding:4px 8px;min-width:36px;min-height:36px}
.empty{color:var(--muted);font-size:14px;padding:6px 0}

.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:13.5px;min-height:34px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
input[type=text],input[type=number],input[type=password],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-height:42px;width:100%;min-width:0}
textarea{resize:vertical;line-height:1.4}
input[type=file]{width:100%;font-size:14px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}

.food{border-top:1px solid var(--line)}
.food:first-child{border-top:0}
.food>button.hd{width:100%;text-align:left;background:none;border:0;padding:12px 0;display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.food .nm{font-weight:500}
.food .sv{font-size:12.5px;color:var(--muted)}
.food .mc{font-size:12.5px;text-align:right;color:var(--muted);white-space:nowrap}
.food .mc b{color:var(--ink);font-weight:500}
.panel{padding:4px 0 16px;display:flex;flex-direction:column;gap:12px}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.stepper button{background:none;border:0;width:40px;height:40px;font-size:20px}
.stepper span{min-width:34px;text-align:center;font-family:var(--f-mono)}
.check{display:flex;gap:10px;align-items:center;font-size:14px}
.check input{flex:none;width:20px;height:20px;accent-color:var(--accent)}
.preview{font-size:13.5px;background:var(--bg);border-radius:8px;padding:8px 12px}

.sug{display:flex;flex-direction:column;gap:10px}
.sug h3{font-size:17px}
.sug ul{margin:0;padding-left:18px}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{font-family:var(--f-mono);font-size:12.5px;padding:3px 9px;border-radius:6px;background:var(--bg);border:1px solid var(--line)}
.pill.p{border-color:var(--c-p);color:var(--c-p)}

.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs img{width:76px;height:76px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.lkitem{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-top:1px solid var(--line)}
.lkitem:first-of-type{border-top:0;padding-top:0}
.lkitem select{width:auto;min-height:34px;padding:4px 8px}
.badge{font-size:12px;font-family:var(--f-mono);padding:2px 8px;border-radius:6px;border:1px solid var(--line)}
.badge.high{color:var(--good);border-color:var(--good)} .badge.medium{color:var(--warn);border-color:var(--warn)} .badge.low{color:var(--bad);border-color:var(--bad)}
a.link{color:var(--accent);font-size:13px}
.dots span{display:inline-block;animation:blink 1.2s infinite both}
.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}

.chatlog{display:flex;flex-direction:column;gap:12px}
.msg{border-radius:12px;padding:12px 14px;max-width:100%;min-width:0;display:flex;flex-direction:column;gap:10px}
.msg.user{background:var(--accent-soft);border:1px solid var(--accent);align-self:flex-end;max-width:92%}
.msg.ai{background:var(--surface);border:1px solid var(--line)}
.tablewrap{overflow-x:auto}
table.mt{border-collapse:collapse;width:100%;min-width:340px;font-size:13.5px}
table.mt th,table.mt td{padding:7px 6px;text-align:right;border-top:1px solid var(--line);vertical-align:top}
table.mt th:first-child,table.mt td:first-child{text-align:left}
table.mt thead th{border-top:0;font-size:11px;font-weight:500;color:var(--muted);font-family:var(--f-mono);text-transform:uppercase;letter-spacing:.06em}
table.mt tfoot th{font-weight:600;font-size:14px;color:var(--ink)}
.composer{border-color:var(--accent)}
.chartwrap{overflow-x:auto}
.chart{display:grid;grid-template-columns:repeat(7,minmax(38px,1fr));gap:8px;align-items:end;height:170px;position:relative;min-width:300px;padding-top:18px}
.col{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;position:relative;z-index:1}
.col .v{font-size:11px;font-family:var(--f-mono);margin-bottom:3px;color:var(--muted)}
.col .b{width:100%;max-width:34px;background:var(--col);border-radius:4px 4px 0 0;min-height:2px}
.tline{position:absolute;left:0;right:0;border-top:2px dashed var(--ink);opacity:.55;z-index:2;pointer-events:none}
.days{display:grid;grid-template-columns:repeat(7,minmax(38px,1fr));gap:8px;min-width:300px;margin-top:6px;text-align:center;font-size:11.5px;color:var(--muted)}
.days .today{color:var(--ink);font-weight:600}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
details summary{cursor:pointer;font-weight:500;min-height:34px;display:flex;align-items:center}
details[open] summary{margin-bottom:10px}
.foot{font-size:12.5px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.fill{transition:width .3s ease}}
@media (prefers-reduced-motion:reduce){.dots span{animation:none;opacity:1}}

/* standalone page basics (the Claude viewer used to supply these) */
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);-webkit-text-size-adjust:100%}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
button,input,select,textarea{-webkit-tap-highlight-color:transparent}
input,select,textarea{font-size:16px}
</style>
</head>

      <button role="tab" data-tab="week">Week</button>

  <main id="main"></main>

</div>

function pad(n){return String(n).padStart(2,'0')}

function computeTargets(st){
  const d=DIETS[st.diet]||null;
  const p=Math.round(st.weight*(d?d.ppk:st.ppk)), k=st.kcal;
  let c,mode;
  if(d){c=Math.max(0,Math.round(d.carb(k,p)));mode=d.mode}else{c=st.carbs;mode=st.carbMode}
  return {k,p,c,f:Math.max(0,Math.round((k-4*p-4*c)/9)),mode};
}
function suggestKcal(st){
  const bmr=10*st.weight+6.25*st.height-5*st.age+(st.sex==='female'?-161:5);
  const g={lose:0.8,maintain:1,gain:1.1}[st.goal]||1;
  return Math.max(1200,Math.round(bmr*st.activity*g/10)*10);
}
function allowed(food,avoid){
  const t=food.t||[];

}

function macrosFor(food,e){
  if(!food) return {k:0,p:0,c:0,f:0,cost:0};
  const b=(e.peel&&food.peel)?food.peel:food;
  const s=(food.sauce&&SAUCES[e.sauce])?SAUCES[e.sauce]:SAUCES.none;
  return {k:(b.k+s.k)*e.qty,p:(b.p+s.p)*e.qty,c:(b.c+s.c)*e.qty,f:(b.f+s.f)*e.qty,cost:(food.price||0)*e.qty};
}
function sumMacros(list){return list.reduce((a,m)=>({k:a.k+m.k,p:a.p+m.p,c:a.c+m.c,f:a.f+m.f,cost:a.cost+m.cost}),{k:0,p:0,c:0,f:0,cost:0})}

function dayNotes(tot,T,isToday,hour){
  const out=[];
  if(tot.k===0) return [{tone:'',text:'Nothing logged for this day yet.'}];
  const pctP=tot.p/T.p, pctK=tot.k/T.k;
  if(T.mode==='cap'){
    if(tot.c>T.c) out.push({tone:'warn',text:'Carbs are '+n0(tot.c-T.c)+' g over your '+T.c+' g cap.'});
    else out.push({tone:'good',text:'Carbs are at '+n0(tot.c)+' g, inside your '+T.c+' g cap.'});
  } else if(tot.c>T.c*1.15){
    out.push({tone:'warn',text:'Carbs are '+n0(tot.c-T.c)+' g over your '+T.c+' g target.'});
  }
  if(tot.f>T.f*1.2) out.push({tone:'warn',text:'Fat is '+n0(tot.f-T.f)+' g over your '+T.f+' g target.'});
  if(tot.k>T.k*1.1) out.push({tone:'warn',text:'Calories are '+n0(tot.k-T.k)+' over your target.'});
  if(isToday){
    if(hour>=19&&pctP<0.7) out.push({tone:'warn',text:'Protein is at '+Math.round(pctP*100)+'% of target. A protein-heavy dinner could add up to '+n0(T.p-tot.p)+' g.'});
    else if(pctP>=1) out.push({tone:'good',text:'Protein target reached.'});
  } else {
    if(pctP<0.7) out.push({tone:'warn',text:'Protein finished at '+Math.round(pctP*100)+'% of target.'});
    if(pctK<0.6) out.push({tone:'warn',text:'Calories finished at '+n0(tot.k)+', well under your '+n0(T.k)+' target. If days like this are common, a dietitian can help set a safe target.'});
  }
  return out;
}

// Finds up to 3 combos of 1 to 3 foods that fit what is left and the budget. Pass only foods the person allows.
function suggest(foods,rem,kind,budget,mode){
  const share=kind==='lunch'?0.5:1;
  const tP=Math.max(0,rem.p)*share, tK=Math.max(0,rem.k)*share, tC=Math.max(12,rem.c*share), tF=Math.max(0,rem.f)*share;
  const opts=[];
  for(const f of foods){
    for(const qty of [1,2]){
      const e={food:f.id,qty,peel:!!f.peel&&mode==='cap',sauce:f.sauce?'vinegar':'none'};
      const m=macrosFor(f,e);
      if(m.cost>budget||(m.cost===0&&f.price===0)) continue;
      opts.push({f,e,m});
    }
  }
  const scored=[];
  const score=(items)=>{
    const t=sumMacros(items.map(o=>o.m));
    if(t.cost>budget) return null;
    const short=Math.max(0,tP-t.p), over=Math.max(0,t.p-tP);
    let s=short+over*0.4+Math.max(0,t.f-tF)*0.8+Math.max(0,t.k-tK)*0.12+(items.length-1)*3;
    s+=mode==='cap'?Math.max(0,t.c-tC)*2.5:Math.abs(t.c-tC)*0.5;
    if(items.some(o=>o.f.veg)) s-=6;
    return {s,t,items};
  };
  let pool=opts;
  if(opts.length>64){
    const ranked=opts.map(o=>({o,s:score([o]).s})).sort((x,y)=>x.s-y.s).map(x=>x.o);
    pool=ranked.slice(0,56).concat(ranked.slice(56).filter(o=>o.f.veg).slice(0,8));
  }
  const n=pool.length;
  for(let a=0;a<n;a++){
    let r=score([pool[a]]); if(r) scored.push(r);
    for(let b=a+1;b<n;b++){
      if(pool[b].f.id===pool[a].f.id) continue;
      r=score([pool[a],pool[b]]); if(r) scored.push(r);
      for(let c=b+1;c<n;c++){
        if(pool[c].f.id===pool[a].f.id||pool[c].f.id===pool[b].f.id) continue;
        r=score([pool[a],pool[b],pool[c]]); if(r) scored.push(r);
      }
    }
  }
  scored.sort((x,y)=>x.s-y.s);
  const picked=[];
  for(const r of scored){
    const ids=r.items.map(o=>o.f.id);
    if(picked.every(p=>p.items.filter(o=>ids.includes(o.f.id)).length<2)) picked.push(r);
    if(picked.length===3) break;
  }
  return {picked,tP,tK,tC};
}

async function imageToBlock(file){
  let bmp;
  try{ bmp=await createImageBitmap(file) }
  catch(e){
    bmp=await new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{URL.revokeObjectURL(u);res(im)};im.onerror=()=>{URL.revokeObjectURL(u);rej({code:'image_rejected'})};im.src=u});
  }
  const w0=bmp.width||bmp.naturalWidth, h0=bmp.height||bmp.naturalHeight;
  if(!w0||!h0) throw {code:'image_rejected'};
  const sc=Math.min(1,1568/Math.max(w0,h0)), w=Math.max(1,Math.round(w0*sc)), h=Math.max(1,Math.round(h0*sc));
  const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
  const cx=cv.getContext('2d'); cx.fillStyle='#fff'; cx.fillRect(0,0,w,h); cx.drawImage(bmp,0,0,w,h);
  if(bmp.close) bmp.close();
  const blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',0.85));
  if(!blob) throw {code:'image_rejected'};
  const data=await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(String(fr.result).split(',')[1]);fr.onerror=()=>rej({code:'image_rejected'});fr.readAsDataURL(blob)});
  return {type:'image',source:{type:'base64',media_type:'image/jpeg',data}};
}
async function callOpenRouter(system,turns,files,useWeb,signal){
  const blocks=[]; for(const f of files){const b=await imageToBlock(f);blocks.push({type:'image_url',image_url:{url:'data:image/jpeg;base64,'+b.source.data}})}
  const msgs=[{role:'system',content:system}].concat(turns.map(t=>({role:t.role,content:t.content})));
  const last=msgs[msgs.length-1];
  if(blocks.length) last.content=[{type:'text',text:last.content}].concat(blocks);
  const body={model:AI.model(),max_tokens:4000,messages:msgs};
  if(useWeb) body.plugins=[{id:'web',max_results:3}];
  let res;
  try{
    res=await fetch('https://openrouter.ai/api/v1/chat/completions',{method:'POST',signal,
      headers:{'content-type':'application/json','authorization':'Bearer '+AI.key(),'HTTP-Referer':location.origin,'X-Title':'Macros Tracker'},
      body:JSON.stringify(body)});
  }catch(e){ if(e&&e.name==='AbortError') throw {code:'cancelled'}; throw {code:'network'} }
  const data=await res.json().catch(()=>null);
  if(!res.ok) throw {code:'http_'+res.status,status:res.status,message:String((data&&data.error&&data.error.message)||'').slice(0,300)};
  if(data&&data.error) throw {code:'http_'+(data.error.code||500),message:String(data.error.message||'').slice(0,300)};
  const ch=data&&data.choices&&data.choices[0], msg=ch&&ch.message;
  let text=msg&&msg.content; if(Array.isArray(text)) text=text.map(p=>p&&p.text||'').join('');
  if(typeof text!=='string'||!text.trim()) throw {code:'invalid_json'};
  const urls=[]; (msg.annotations||[]).forEach(a=>{const u=a&&a.type==='url_citation'&&a.url_citation; if(u&&u.url) urls.push({url:u.url,title:u.title||''})});
  return {text,urls,stop:ch.finish_reason==='length'?'max_tokens':(ch.finish_reason||'')};
}
async function callClaude(system,turns,files,useWeb,signal){
  if(AI.or()) return callOpenRouter(system,turns,files,useWeb,signal);
  const blocks=[]; for(const f of files) blocks.push(await imageToBlock(f));
  const msgs=turns.map(t=>({role:t.role,content:t.content}));
  const last=msgs[msgs.length-1];
  if(blocks.length) last.content=blocks.concat([{type:'text',text:last.content}]);
  const body={model:AI.model(),max_tokens:6000,system,messages:msgs,output_config:{effort:'medium'}};
  if(useWeb) body.tools=[{type:'web_search_20250305',name:'web_search',max_uses:3}];
  const urls=[]; let text='', stop='';
  for(let round=0;round<4;round++){
    let res;
    try{
      res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',signal,
        headers:{'content-type':'application/json','x-api-key':AI.key(),'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
        body:JSON.stringify(body)});
    }catch(e){ if(e&&e.name==='AbortError') throw {code:'cancelled'}; throw {code:'network'} }
    const data=await res.json().catch(()=>null);
    if(!res.ok) throw {code:'http_'+res.status,status:res.status,message:String((data&&data.error&&data.error.message)||'').slice(0,300)};
    const content=Array.isArray(data&&data.content)?data.content:[];
    text=''; stop=data.stop_reason||'';
    for(const b of content){
      if(b.type==='text'&&typeof b.text==='string') text+=b.text;
      if(b.type==='web_search_tool_result'&&Array.isArray(b.content)) b.content.forEach(r=>{if(r&&r.url) urls.push({url:r.url,title:r.title||''})});
    }
    if(stop==='pause_turn'){ body.messages=body.messages.concat([{role:'assistant',content}]); continue }
    return {text,urls,stop};
  }
  return {text,urls,stop:'paused'};
}
function parseJsonLoose(t){
  const a=t.indexOf('{'), b=t.lastIndexOf('}');
  if(a<0||b<a) throw {code:'invalid_json'};
  try{ return JSON.parse(t.slice(a,b+1)) }catch(e){ throw {code:'invalid_json'} }
}
const normUrl=u=>String(u).replace(/#.*$/,'').replace(/\/+$/,'');
function pickSource(src,urls){
  if(!src||!/^https?:\/\//.test(String(src.url||''))) return null;
  const want=normUrl(src.url);
  let hit=urls.find(x=>normUrl(x.url)===want);
  if(!hit){ try{ const h=new URL(src.url).hostname; hit=urls.find(x=>{try{return new URL(x.url).hostname===h}catch(e){return false}}) }catch(e){} }
  return hit&&/^https?:\/\//.test(hit.url)?{url:hit.url,title:String(src.title||hit.title||'Source').slice(0,48)}:null;
}

function askErrText(e){
  const c=e&&e.code, m=e&&e.message?String(e.message):'';
  const who=AI.or()?'OpenRouter':'Anthropic';
  if(c==='http_402') return 'OpenRouter says you need credits for this request. Turn off web search or use a free model.';
  if(c==='http_404'&&AI.or()) return 'OpenRouter found no model that can handle this request'+(m?': '+m:'.')+' Try again, or pick a different model in Targets.';
  if(c==='http_401') return who+' did not accept your API key. Check it in Targets.';
  if(c==='http_403') return 'This API key is not allowed to make this request. Check your Anthropic account.';
  if(c==='http_400'){
    if(/web.?search/i.test(m)) return 'Web search is not available for this account ('+m+'). Turn off "Search the web" in Targets, or enable web search in the Anthropic Console.';
    return who+' rejected the request'+(m?': '+m:'.');
  }
  if(c==='http_429') return AI.or()?'Rate limit reached. Free models allow about 20 requests a minute and a daily cap. Wait and try again.':'Rate limit reached. Wait a minute and try again.';
  if(c==='http_413') return 'That request was too large. Use smaller or fewer photos.';
  if(/^http_5/.test(c||'')||c==='http_529') return who+' is busy right now. Try again shortly.';
  if(c==='network') return 'Could not reach '+who+'. Check your internet connection.';
  if(c==='image_rejected') return 'That photo could not be read. Try a JPEG or PNG.';
  if(c==='invalid_json') return 'The reply was not readable. Send it again, maybe with a few more details.';
  if(c==='truncated') return 'The answer was cut off. Try again with fewer foods at a time.';
  return 'Something went wrong. Send it again.';
}

  const C=S.chat, ta=$('#asktext'), text=(ta?ta.value:C.text).trim();
  if(C.busy) return;
  if(!hasKey()){C.state='Add your API key first.';chatState();return}
  if(!text&&!C.files.length){C.state='Describe the meal or add a photo first.';chatState();return}
  const files=C.files.slice(), urls=C.urls.slice();
  const userText=text||'(photo only)';
  C.msgs.push({role:'user',text:userText,urls}); C.files=[]; C.urls=[]; C.text=''; if(ta) ta.value='';
  const fi=$('#askfile'); if(fi) fi.value=''; chatThumbs();
  const ctl=new AbortController(); C.ctl=ctl; C.busy=true; C.state='';
  $('#asksend').disabled=true; $('#askstop').hidden=false; chatState(); renderChat(true);
  const content=userText+(files.length?'\n[Photos attached: '+files.length+']':'');
  const useWeb=AI.web();
  let hist=C.turns.slice(-8); while(hist.length&&hist[0].role!=='user') hist=hist.slice(1);
  const turns=hist.concat([{role:'user',content}]);
  try{
    const r=await callClaude(askInstructions(useWeb),turns,files,useWeb,ctl.signal);
    if(r.stop==='max_tokens') throw {code:'truncated'};
    const out=parseJsonLoose(r.text);
    const num=v=>Math.max(0,Number(v)||0);
    const items=(out&&Array.isArray(out.items)?out.items:[]).slice(0,15).map(i=>({
      name:String(i.name||'Food').slice(0,80),portion:String(i.portion||'').slice(0,80),
      k:num(i.kcal),p:num(i.protein),c:num(i.carbs),f:num(i.fat),
      conf:['high','medium','low'].includes(i.confidence)?i.confidence:'medium',note:String(i.note||'').slice(0,200),on:true,
      src:i.basis==='web'?pickSource(i.source,r.urls):null
    }));
    const reply=String((out&&out.reply)||'').slice(0,900)||(items.length?'Here is my estimate.':'I could not find any food in that.');
    C.msgs.push({role:'ai',reply,items,logged:false});
    C.turns.push({role:'user',content},{role:'assistant',content:JSON.stringify({reply,items:items.map(i=>({name:i.name,portion:i.portion,kcal:i.k,protein:i.p,carbs:i.c,fat:i.f,basis:i.src?'web':'estimate',source:i.src?{title:i.src.title,url:i.src.url}:null}))})});
  }catch(e){
    if(!(e&&e.code==='cancelled')) C.msgs.push({role:'ai',err:askErrText(e)});
  }
  C.busy=false; C.ctl=null; C.state='';
  if(S.tab==='add'){chatState();const b=$('#asksend'),st=$('#askstop');if(b)b.disabled=false;if(st)st.hidden=true;if(C.msgs.length&&!$('[data-act=chatnew]')&&st){const nb=document.createElement('button');nb.className='btn ghost';nb.dataset.act='chatnew';nb.textContent='New search';st.after(nb)}renderChat(true)}
}

function renderNext(){
  const T=computeTargets(settings), tot=totalsFor(S.date);
  const rem={k:T.k-tot.k,p:T.p-tot.p,c:T.c-tot.c,f:T.f-tot.f};
  const active=Object.keys(settings.avoid).filter(k=>settings.avoid[k]).map(k=>AVOID_LABELS[k]);
  let h='<section class="card"><div class="label" style="margin-bottom:8px">Still open on '+(S.date===todayStr()?'today':fmtDate(S.date))+'</div><div class="pills"><span class="pill p">Protein '+n0(Math.max(0,rem.p))+' g</span><span class="pill">Carbs '+n0(Math.max(0,rem.c))+' g</span><span class="pill">Fat '+n0(Math.max(0,rem.f))+' g</span><span class="pill">'+n0(Math.max(0,rem.k))+' kcal</span></div></section>';
  h+='<section class="card stack"><div class="grid2"><div class="field"><label class="label" for="smeal">This meal is</label><select id="smeal"><option value="lunch"'+(S.sugMeal==='lunch'?' selected':'')+'>Lunch (half of what is left)</option><option value="dinner"'+(S.sugMeal==='dinner'?' selected':'')+'>Dinner (all of what is left)</option></select></div>'
   +'<div class="field"><label class="label" for="sbudget">Budget for this meal (₱)</label><input type="number" id="sbudget" inputmode="numeric" min="20" step="10" value="'+S.budget+'"></div></div>'
   +'<p class="small muted" style="margin:0">'+(active.length?'Skipping: '+esc(active.join(', '))+'. Change this in Targets.':'No food filters on. Set them in Targets.')+'</p></section><div class="sug" id="sugout"></div>';
  $('#main').innerHTML=h; renderSug();
}
function renderSug(){
  const T=computeTargets(settings), tot=totalsFor(S.date);
  const rem={k:T.k-tot.k,p:T.p-tot.p,c:T.c-tot.c,f:T.f-tot.f};
  const out=$('#sugout');
  if(rem.p<=5){out.innerHTML='<section class="card"><p style="margin:0">Your protein target is already met for this day. Anything you add now only needs to fit the calories left.</p></section>';return}
  const r=suggest(okFoods(),rem,S.sugMeal,S.budget,T.mode);
  if(!r.picked.length){out.innerHTML='<section class="card"><p style="margin:0">Nothing on the list fits ₱'+S.budget+' with your food filters. Raise the budget a little.</p></section>';return}
  out.innerHTML='<div class="label">Aiming for about '+n0(r.tP)+' g protein'+(T.mode==='cap'?', up to '+n0(r.tC)+' g carbs':'')+'</div>'+r.picked.map((p,i)=>{
    return '<section class="card sug"><h3>Option '+(i+1)+' · about ₱'+n0(p.t.cost)+'</h3><ul>'+p.items.map(o=>{
      const mod=modText(o.e);
      return '<li>'+(o.e.qty>1?o.e.qty+' × ':'')+esc(o.f.name)+(mod?' <span class="muted">('+esc(mod)+')</span>':'')+'</li>';
    }).join('')+'</ul><div class="pills"><span class="pill p">P '+n0(p.t.p)+' g</span><span class="pill">C '+n0(p.t.c)+' g</span><span class="pill">F '+n0(p.t.f)+' g</span><span class="pill">'+n0(p.t.k)+' kcal</span></div><div><button class="btn small" data-act="logsug" data-i="'+i+'">Log this to '+(S.sugMeal==='lunch'?'Lunch':'Dinner')+'</button></div></section>';
  }).join('');
  S.lastSug=r.picked;
}

function chart(title,vals,target,col,unit){
  const max=Math.max(target,...vals.map(v=>v.v))*1.1||1;
  let h='<section class="card"><div class="row spread"><h3 style="font-size:17px">'+title+'</h3><span class="small muted mono">target '+n0(target)+' '+unit+'</span></div><div class="chartwrap"><div class="chart">';
  h+='<div class="tline" style="bottom:'+(target/max*(170-18))+'px"></div>';
  h+=vals.map(d=>'<div class="col"><span class="v">'+(d.v?n0(d.v):'')+'</span><div class="b" style="height:'+(d.v/max*(170-18-16))+'px;--col:'+col+'"></div></div>').join('');
  h+='</div><div class="days">'+vals.map(d=>'<span class="'+(d.today?'today':'')+'">'+d.label+'</span>').join('')+'</div></div></section>';
  return h;
}
function renderWeek(){
  const T=computeTargets(settings), t=todayStr(), days=[];
  for(let i=6;i>=0;i--){const d=shiftDate(t,-i);const tt=totalsFor(d);const [y,m,dd]=d.split('-').map(Number);
    days.push({d,k:tt.k,p:tt.p,c:tt.c,label:new Date(y,m-1,dd).toLocaleDateString('en-PH',{weekday:'short'}),today:d===t})}
  const logged=days.filter(x=>x.k>0);
  const avg=f=>logged.length?logged.reduce((a,x)=>a+x[f],0)/logged.length:0;
  let h='<section class="card"><div class="label" style="margin-bottom:8px">Average of '+logged.length+' logged day'+(logged.length===1?'':'s')+'</div><div class="pills"><span class="pill">'+n0(avg('k'))+' kcal</span><span class="pill p">P '+n0(avg('p'))+' g</span><span class="pill">C '+n0(avg('c'))+' g</span></div></section>';
  h+=chart('Protein',days.map(x=>({v:x.p,label:x.label,today:x.today})),T.p,'var(--c-p)','g');
  h+=chart('Carbs',days.map(x=>({v:x.c,label:x.label,today:x.today})),T.c,'var(--c-c)',T.mode==='cap'?'g max':'g');
  h+=chart('Calories',days.map(x=>({v:x.k,label:x.label,today:x.today})),T.k,'var(--c-k)','kcal');
  $('#main').innerHTML=h;
}

const ACT=[[1.2,'Mostly sitting'],[1.375,'Light exercise 1 to 3 days'],[1.55,'Moderate exercise 3 to 5 days'],[1.725,'Hard exercise 6 to 7 days']];
function opt(list,cur){return list.map(([v,l])=>'<option value="'+v+'"'+(String(cur)===String(v)?' selected':'')+'>'+l+'</option>').join('')}
function renderTargets(){
  const s=settings, isCustom=!DIETS[s.diet];
  let h='<section class="card stack"><h3 style="font-size:18px">Eating style</h3><div class="chips">'
   +Object.keys(DIETS).map(k=>'<button class="chip" data-act="diet" data-v="'+k+'" aria-pressed="'+(s.diet===k)+'">'+DIETS[k].name+'</button>').join('')
   +'<button class="chip" data-act="diet" data-v="custom" aria-pressed="'+isCustom+'">Custom</button></div>'
   +'<p class="small muted" style="margin:0">'+(isCustom?'Set your own protein and carb numbers below.':esc(DIETS[s.diet].blurb))+'</p>';
  if(isCustom) h+='<div class="grid2"><div class="field"><label class="label" for="tppk">Protein (g per kg)</label><input type="number" id="tppk" inputmode="decimal" min="0.5" max="3.5" step="0.1" value="'+s.ppk+'"></div>'
   +'<div class="field"><label class="label" for="tc">Carbs (g)</label><input type="number" id="tc" inputmode="numeric" min="0" max="600" step="5" value="'+s.carbs+'"></div>'
   +'<div class="field"><label class="label" for="tmode">Carbs are a</label><select id="tmode"><option value="cap"'+(s.carbMode==='cap'?' selected':'')+'>Daily cap</option><option value="goal"'+(s.carbMode==='goal'?' selected':'')+'>Daily goal</option></select></div></div>';
  h+='</section>'
   +'<section class="card stack"><h3 style="font-size:18px">Calories</h3><div class="grid2">'
   +'<div class="field"><label class="label" for="tsex">Sex</label><select id="tsex"><option value="male"'+(s.sex==='male'?' selected':'')+'>Male</option><option value="female"'+(s.sex==='female'?' selected':'')+'>Female</option></select></div>'
   +'<div class="field"><label class="label" for="tage">Age</label><input type="number" id="tage" inputmode="numeric" min="14" max="100" value="'+s.age+'"></div>'
   +'<div class="field"><label class="label" for="tht">Height (cm)</label><input type="number" id="tht" inputmode="numeric" min="120" max="230" value="'+s.height+'"></div>'
   +'<div class="field"><label class="label" for="twt">Weight (kg)</label><input type="number" id="twt" inputmode="decimal" min="30" max="250" step="0.5" value="'+s.weight+'"></div>'
   +'<div class="field"><label class="label" for="tact">Activity</label><select id="tact">'+opt(ACT,s.activity)+'</select></div>'
   +'<div class="field"><label class="label" for="tgoal">Goal</label><select id="tgoal">'+opt([['lose','Lose weight'],['maintain','Maintain'],['gain','Gain weight']],s.goal)+'</select></div></div>'
   +'<div class="preview" id="tsug"></div>'
   +'<div class="field"><label class="label" for="tk">Daily calories you are using</label><input type="number" id="tk" inputmode="numeric" min="1000" max="5000" step="50" value="'+s.kcal+'"></div></section>'
   +'<section class="card stack"><h3 style="font-size:18px">Foods to skip</h3><p class="small muted" style="margin:0">Hidden from the food list and never suggested.</p><div class="grid2">'
   +Object.keys(AVOID_LABELS).map(k=>'<label class="check"><input type="checkbox" data-av="'+k+'"'+(s.avoid[k]?' checked':'')+'>'+AVOID_LABELS[k]+'</label>').join('')
   +'</div></section>'
   +'<section class="card stack"><h3 style="font-size:18px">Your targets</h3><div class="preview mono" id="tprev"></div><p class="small muted" style="margin:0">These are general starting points. A doctor or dietitian can fit them to you, especially for a medical condition, pregnancy or a large weight change.</p></section>'
   +'<section class="card stack"><h3 style="font-size:18px">Online look-up</h3>'+providerFields()
   +'<div class="row"><button class="btn small" data-act="savekey">Save key</button>'+(hasKey()?'<button class="btn ghost small" data-act="removekey">Remove key</button>':'')+'</div>'
   +(AI.or()?'<div class="field"><label class="label" for="ormodel">Model</label><input type="text" id="ormodel" autocapitalize="off" spellcheck="false" value="'+esc(AI.model())+'"><span class="small muted">openrouter/free picks any free model that fits your request. You can type a specific model name from openrouter.ai/models instead.</span></div>'
    :'<div class="field"><label class="label" for="modelsel">Model</label><select id="modelsel">'+MODELS.map(([v,l])=>'<option value="'+v+'"'+(AI.model()===v?' selected':'')+'>'+l+'</option>').join('')+'</select></div>')
   +'<label class="check"><input type="checkbox" id="webchk"'+(AI.web()?' checked':'')+'>'+(AI.or()?'Search the web (OpenRouter charges credits for this, free models alone cannot)':'Search the web for macros (each search adds a small fee)')+'</label></section>'
   +'<section class="card stack"><h3 style="font-size:18px">Your data</h3><p class="small muted" style="margin:0">Everything is stored in this browser on this device.</p>'
   +(S.reset?'<div class="row"><button class="btn danger small" data-act="resetyes">Yes, delete all entries</button><button class="btn ghost small" data-act="resetno">Cancel</button></div>':'<div><button class="btn ghost small" data-act="reset">Delete all entries</button></div>')
   +'</section>';
  $('#main').innerHTML=h; tprev();
}
function tprev(){
  const T=computeTargets(settings), sk=suggestKcal(settings);
  const p=$('#tprev'); if(p) p.textContent=n0(T.k)+' kcal · P '+T.p+' g · C '+(T.mode==='cap'?'max ':'')+T.c+' g · F '+T.f+' g';
  const s=$('#tsug'); if(s) s.innerHTML='Estimated need for your goal: <b class="mono">'+n0(sk)+' kcal</b> <button class="btn small" style="margin-left:8px" data-act="usekcal" data-k="'+sk+'">Use this</button>'+(settings.kcal<1200?'<div class="small" style="margin-top:6px;color:var(--bad)">Below 1,200 kcal a day should be guided by a clinician.</div>':'');
}

function render(){
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===S.tab)));
  ({today:renderToday,add:renderAdd,next:renderNext,week:renderWeek,targets:renderTargets})[S.tab]();
}
function addEntry(e){(logs[S.date]=logs[S.date]||[]).push(Object.assign({id:uid()},e));save()}

document.addEventListener('click',ev=>{
  const tb=ev.target.closest('#tabs button');
  if(tb){S.tab=tb.dataset.tab;S.reset=false;render();window.scrollTo(0,0);return}
  const el=ev.target.closest('[data-act]'); if(!el) return;
  const a=el.dataset.act;
  if(a==='day'){S.date=shiftDate(S.date,Number(el.dataset.d));if(S.date>todayStr())S.date=todayStr();render()}
  else if(a==='del'){logs[S.date]=entries(S.date).filter(e=>e.id!==el.dataset.id);save();render()}
  else if(a==='clearsample'){for(const d of Object.keys(logs)){logs[d]=logs[d].filter(e=>!e.ex)}save();render()}
  else if(a==='addto'){S.meal=el.dataset.meal;S.tab='add';render()}
  else if(a==='meal'){S.meal=el.dataset.v;renderChips();renderList()}
  else if(a==='cat'){S.cat=el.dataset.v;renderChips();renderList()}
  else if(a==='showhidden'){S.showHidden=!S.showHidden;renderList()}
  else if(a==='open'){S.open=S.open===el.dataset.id?null:el.dataset.id;S.draft={qty:1,peel:false,sauce:'none'};renderList()}
  else if(a==='qty'){S.draft.qty=Math.max(1,Math.min(20,S.draft.qty+Number(el.dataset.d)));renderList()}
  else if(a==='add'){
    const f=foodById(el.dataset.id);
    addEntry({food:f.id,qty:S.draft.qty,meal:S.meal,peel:!!(f.peel&&S.draft.peel),sauce:f.sauce?S.draft.sauce:'none'});
    toast('Added '+f.name+' to '+MEALS.find(x=>x[0]===S.meal)[1]);
    S.open=null;S.draft={qty:1,peel:false,sauce:'none'};renderList();
  }
  else if(a==='savecustom'){
    const name=$('#cn').value.trim(); const num=id=>Math.max(0,parseFloat($(id).value)||0);
    if(!name||!num('#ck')){toast('Enter a name and calories');return}
    custom.push({id:'c'+uid(),name,cat:'Custom',serving:'1 serving',k:num('#ck'),p:num('#cp'),c:num('#cc'),f:num('#cf'),price:num('#cpr')});
    store.set('km.custom',custom);S.cat='Custom';toast('Saved '+name);renderAdd();
  }
  else if(a==='lookupq'){lookupFromQ()}
  else if(a==='savekey'){const v=($('#keyinput').value||'').trim();if(v.length<10){toast('Paste your full API key');return}AI.setKey(v);toast('Key saved');render()}
  else if(a==='removekey'){AI.setKey('');toast('Key removed');renderTargets()}
  else if(a==='chatsend'){S.chat.text=$('#asktext').value;sendChat()}
  else if(a==='chatstop'){if(S.chat.ctl)S.chat.ctl.abort()}
  else if(a==='chatnew'){S.chat.msgs.forEach(m=>(m.urls||[]).forEach(u=>URL.revokeObjectURL(u)));S.chat.urls.forEach(u=>URL.revokeObjectURL(u));S.chat={turns:[],msgs:[],text:'',files:[],urls:[],busy:false,state:'',ctl:null};renderAdd()}
  else if(a==='photoclear'){S.chat.urls.forEach(u=>URL.revokeObjectURL(u));S.chat.files=[];S.chat.urls=[];const fi=$('#askfile');if(fi)fi.value='';chatThumbs()}
  else if(a==='example'){const ta=$('#asktext');if(ta){ta.value=el.dataset.t;S.chat.text=el.dataset.t;ta.focus()}}
  else if(a==='chatlog'){
    const m=S.chat.msgs[Number(el.dataset.m)]; if(!m||m.logged) return;
    const sel=m.items.filter(i=>i.on);
    if(!sel.length){toast('Select at least one item');return}
    sel.forEach(it=>addEntry({food:'adhoc',adhoc:{name:it.name,serving:it.portion,k:it.k,p:it.p,c:it.c,f:it.f},qty:1,meal:S.meal,peel:false,sauce:'none'}));
    m.logged=true;m.loggedMeal=MEALS.find(x=>x[0]===S.meal)[1];
    toast('Logged '+sel.length+' item'+(sel.length===1?'':'s')+' to '+m.loggedMeal);renderChat(false);
  }
  else if(a==='chatsave'){
    const m=S.chat.msgs[Number(el.dataset.m)]; if(!m) return;
    const sel=m.items.filter(i=>i.on);
    if(!sel.length){toast('Select at least one item');return}
    sel.forEach(it=>custom.push({id:'c'+uid(),name:it.name,cat:'Custom',serving:it.portion||'1 serving',k:it.k,p:it.p,c:it.c,f:it.f,price:0}));
    store.set('km.custom',custom);toast('Saved '+sel.length+' to your foods');
  }
  else if(a==='logsug'){
    const p=(S.lastSug||[])[Number(el.dataset.i)]; if(!p) return;
    p.items.forEach(o=>addEntry({food:o.f.id,qty:o.e.qty,meal:S.sugMeal,peel:o.e.peel,sauce:o.e.sauce}));
    toast('Logged to '+(S.sugMeal==='lunch'?'Lunch':'Dinner'));renderNext();
  }
  else if(a==='diet'){
    const k=el.dataset.v;
    if(k==='custom'&&DIETS[settings.diet]){const T=computeTargets(settings);settings.ppk=Math.round(T.p/settings.weight*10)/10;settings.carbs=T.c;settings.carbMode=T.mode}
    settings.diet=k;saveSettings();renderTargets();
  }
  else if(a==='usekcal'){settings.kcal=Number(el.dataset.k);saveSettings();renderTargets()}
  else if(a==='reset'){S.reset=true;renderTargets()}
  else if(a==='resetno'){S.reset=false;renderTargets()}
  else if(a==='resetyes'){logs={};save();S.reset=false;toast('All entries deleted');renderTargets()}
});
document.addEventListener('change',ev=>{
  const t=ev.target;
  if(t.id==='dpeel'){S.draft.peel=t.checked;renderList()}
  else if(t.id==='dsauce'){S.draft.sauce=t.value;renderList()}
  else if(t.id==='smeal'){S.sugMeal=t.value;renderSug()}
  else if(t.id==='modelsel'){AI.setModel(t.value)}
  else if(t.id==='ormodel'){AI.setModel(t.value.trim())}
  else if(t.id==='provsel'){AI.setProvider(t.value);render()}
  else if(t.id==='webchk'){AI.setWeb(t.checked)}
  else if(t.dataset&&t.dataset.mealsel){S.meal=t.value;if($('#mealchips'))renderChips()}
  else if(t.id==='askfile'){
    S.chat.urls.forEach(u=>URL.revokeObjectURL(u));
    const max=MAX_IMAGES;
    S.chat.files=Array.from(t.files||[]).slice(0,max);
    S.chat.urls=S.chat.files.map(f=>URL.createObjectURL(f));chatThumbs();
  }
  else if(t.dataset&&t.dataset.ck){const m=S.chat.msgs[Number(t.dataset.m)];if(m&&m.items[Number(t.dataset.i)]){m.items[Number(t.dataset.i)].on=t.checked;renderChat(false)}}
  else if(t.dataset&&t.dataset.av){settings.avoid[t.dataset.av]=t.checked;
    if(t.checked&&t.dataset.av==='vegetarian')settings.avoid.pescatarian=false;
    saveSettings();tprev()}
  else if(t.id==='tsex'||t.id==='tact'||t.id==='tgoal'){
    settings[t.id==='tsex'?'sex':t.id==='tact'?'activity':'goal']=t.id==='tact'?Number(t.value):t.value;saveSettings();tprev()}
  else if(t.id==='tmode'){settings.carbMode=t.value;saveSettings();tprev()}
});
document.addEventListener('keydown',ev=>{if(ev.key==='Enter'&&ev.target&&ev.target.id==='q'){ev.preventDefault();lookupFromQ()}});
document.addEventListener('input',ev=>{
  const t=ev.target, m={twt:'weight',tage:'age',tht:'height',tk:'kcal',tppk:'ppk',tc:'carbs'};
  if(m[t.id]){const v=parseFloat(t.value);if(v>0||(t.id==='tc'&&v===0)){settings[m[t.id]]=v;saveSettings();tprev()}}
  else if(t.id==='sbudget'){const v=parseInt(t.value,10);if(v>=20){S.budget=v;renderSug()}}
  else if(t.id==='asktext'){S.chat.text=t.value}
});
render();
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1')){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
